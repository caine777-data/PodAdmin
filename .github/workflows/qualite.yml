# Vérification de qualité : lancée à chaque envoi de code et sur les pull requests.
# Objectif : détecter une régression AVANT la compilation et la distribution.
name: qualité

on:
  push:
  pull_request:
  workflow_dispatch:      # bouton « Run workflow » dans l'onglet Actions

# Lecture seule : les tests n'ont rien à écrire sur le dépôt.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Vérifier la syntaxe de tous les fichiers Python
        run: python -m compileall -q app.py pod_api.py pod_chunked.py config.py

      - name: Lancer les tests
        run: xvfb-run -a python -m pytest tests/ -v

  # Analyse statique et mise en forme (règles dans ruff.toml).
  # Rapide et indépendant des tests : un échec ici signale du code qui dérive
  # (import inutilisé, except nu, fichier non formaté) avant même de compiler.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ruff
        # Version FIXÉE : une nouvelle version de ruff peut changer ses règles
        # ou sa mise en forme et faire échouer ce contrôle sans que le code ait
        # bougé. On la monte à la main, en même temps que la machine locale.
        run: python -m pip install ruff==0.16.8

      - name: Analyser le code
        run: python -m ruff check --output-format=github .

      - name: Vérifier la mise en forme
        run: python -m ruff format --check .
