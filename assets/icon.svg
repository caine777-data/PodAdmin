<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4c95"/>
      <stop offset="1" stop-color="#162a5e"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaeff8"/>
    </linearGradient>
  </defs>

  <!-- Fond : carré arrondi, dégradé bleu UT (identique à la famille Téléverseur) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- Cadre vidéo / pellicule, légèrement incliné -->
  <g transform="rotate(-14 470 470)">
    <rect x="232" y="196" width="476" height="556" rx="40" fill="url(#film)"/>
    <!-- perforations haut et bas -->
    <g fill="#2a4c95">
      <rect x="262" y="226" width="60" height="46" rx="12"/>
      <rect x="352" y="226" width="60" height="46" rx="12"/>
      <rect x="442" y="226" width="60" height="46" rx="12"/>
      <rect x="532" y="226" width="60" height="46" rx="12"/>
      <rect x="618" y="226" width="60" height="46" rx="12"/>
      <rect x="262" y="676" width="60" height="46" rx="12"/>
      <rect x="352" y="676" width="60" height="46" rx="12"/>
      <rect x="442" y="676" width="60" height="46" rx="12"/>
      <rect x="532" y="676" width="60" height="46" rx="12"/>
      <rect x="618" y="676" width="60" height="46" rx="12"/>
    </g>
    <!-- écran central -->
    <rect x="282" y="312" width="376" height="324" rx="22" fill="#dde5f2"/>
    <!-- triangle de lecture -->
    <path d="M428 396 L428 552 L560 474 Z" fill="#2a4c95"/>
  </g>

  <!-- Badge d'angle (réglages / administration) : engrenage rouge UT -->
  <g transform="translate(726 726)">
    <circle cx="0" cy="0" r="180" fill="#ffffff"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#e7ecf5" stroke-width="2"/>
    <g fill="#d52b35">
      <circle cx="0" cy="0" r="96"/>
      <g>
        <rect x="-22" y="-138" width="44" height="52" rx="9"/>
        <rect x="-22" y="86" width="44" height="52" rx="9"/>
        <rect x="-138" y="-22" width="52" height="44" rx="9"/>
        <rect x="86" y="-22" width="52" height="44" rx="9"/>
        <rect x="-124" y="-124" width="44" height="50" rx="9" transform="rotate(45 -102 -99)"/>
        <rect x="80" y="-124" width="44" height="50" rx="9" transform="rotate(-45 102 -99)"/>
        <rect x="-124" y="74" width="44" height="50" rx="9" transform="rotate(-45 -102 99)"/>
        <rect x="80" y="74" width="44" height="50" rx="9" transform="rotate(45 102 99)"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="40" fill="#ffffff"/>
  </g>
</svg>
