name: Build installers

# Compile PodAdmin et fabrique TOUS les livrables en un seul run :
#   Windows :
#     • PodAdmin.exe          — exécutable portable (sans installation)
#     • PodAdmin-Setup.exe    — installeur Inno Setup (menu Démarrer, désinstalleur)
#   macOS :
#     • PodAdmin.dmg          — image disque (glisser dans Applications)
#     • PodAdmin-macOS.zip    — archive .app (comme avant, pour compatibilité)
#
# Déclencheurs :
#   • Bouton "Run workflow" dans l'onglet Actions (build manuel)
#   • Push d'un tag v* (ex : v1.0.0) → crée automatiquement une Release GitHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Écrire OUI pour PUBLIER une version (le numéro est lu dans __version__.py). Laisser VIDE = compilation d'essai."
        required: false
        default: ""
      notes:
        description: "Phrase affichée dans le bandeau de mise à jour (facultatif)"
        required: false
        default: ""

jobs:
  # ─────────────────────────────── WINDOWS ───────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # L'icône de l'application est fournie dans assets/icon.ico (dessin original).
      # On la copie sous le nom attendu par l'étape de compilation.
      - name: Préparer l'icône Windows
        run: copy assets\icon.ico assets\podadmin.ico

      # --onedir et NON --onefile.
      #
      # En --onefile, l'exe est une archive auto-extractible : à CHAQUE
      # lancement, Windows décompresse tout l'interpréteur Python et les
      # bibliothèques dans un dossier temporaire avant d'exécuter quoi que ce
      # soit. Mesuré côté application : 1,3 s d'import et 1,3 s de
      # construction, auxquelles cette décompression s'ajoute intégralement.
      #
      # En --onedir, les fichiers sont déjà en place : le démarrage est 3 à 5
      # fois plus rapide. Le prix est un dossier au lieu d'un fichier unique,
      # ce qui ne change rien pour l'installeur — Inno Setup embarque le
      # dossier — et impose seulement de dézipper le portable avant usage.
      - name: Compiler PodAdmin (portable, --onedir)
        run: |
          $icon = (Test-Path "assets/podadmin.ico") ? "--icon=assets/podadmin.ico" : ""
          pyinstaller --onedir --windowed --name "PodAdmin" `
            --version-file version.txt `
            $icon `
            --collect-all customtkinter `
            --collect-all keyring `
            --collect-all tkinterdnd2 `
            --collect-all openpyxl `
            --collect-all certifi `
            --collect-all requests `
            --add-data "assets;assets" `
            app.py

      # Le portable devient un DOSSIER : on publie son contenu entier.
      # ⚠️ PodAdmin.exe seul ne fonctionne pas en --onedir — il lui faut les
      # fichiers voisins. Le nom de l'artefact le rappelle.
      - name: Publier le portable Windows (dossier complet)
        uses: actions/upload-artifact@v4
        with:
          name: PodAdmin-Windows-portable-dossier
          path: dist/PodAdmin/

      # Installe Inno Setup (compilateur d'installeurs Windows) via Chocolatey.
      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      # Génère le script .iss puis compile l'installeur.
      # Installation SANS droits administrateur (dans le profil utilisateur),
      # avec raccourcis menu Démarrer + Bureau et désinstalleur.
      - name: Fabriquer l'installeur (Inno Setup)
        run: |
          $iss = @"
          [Setup]
          AppName=PodAdmin
          AppVersion=1.5.6
          AppPublisher=Universite de Toulouse
          AppCopyright=(c) Copyright 2026 Cedric MONNA
          DefaultDirName={localappdata}\Programs\PodAdmin
          DefaultGroupName=PodAdmin
          PrivilegesRequired=lowest
          OutputDir=installer
          OutputBaseFilename=PodAdmin-Setup
          Compression=lzma
          SolidCompression=yes
          SetupIconFile=assets\podadmin.ico
          WizardStyle=modern

          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"

          [Files]
          ; --onedir : tout le dossier est embarqué, sous-dossiers compris
          ; (_internal). Ne copier que l'exe donnerait une application qui
          ; s'installe sans erreur mais refuse de démarrer.
          Source: "dist\PodAdmin\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\PodAdmin"; Filename: "{app}\PodAdmin.exe"
          Name: "{group}\Désinstaller PodAdmin"; Filename: "{uninstallexe}"
          Name: "{userdesktop}\PodAdmin"; Filename: "{app}\PodAdmin.exe"

          [Run]
          Filename: "{app}\PodAdmin.exe"; Description: "Lancer PodAdmin"; Flags: nowait postinstall skipifsilent
          "@
          # Si l'icône n'a pas été générée, on retire la ligne SetupIconFile.
          if (-not (Test-Path "assets/podadmin.ico")) {
            $iss = $iss -replace "SetupIconFile=assets\\podadmin.ico`r?`n", ""
          }
          Set-Content -Path "PodAdmin.iss" -Value $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "PodAdmin.iss"

      - name: Publier l'installeur Windows
        uses: actions/upload-artifact@v4
        with:
          name: PodAdmin-Windows-Setup
          path: installer/PodAdmin-Setup.exe

  # ──────────────────────────────── macOS ────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Génère l'icône macOS (.icns) à partir du PNG master, via les outils
      # Apple sips/iconutil (présents uniquement sur les runners macOS).
      - name: Générer l'icône macOS (.icns)
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon_master.png --out "icon.iconset/icon_${s}x${s}.png"
            d=$((s*2))
            sips -z $d $d assets/icon_master.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns icon.iconset -o assets/icon.icns

      - name: Compiler PodAdmin.app
        run: |
          # --onedir et NON --onefile, pour deux raisons qui vont dans le même
          # sens :
          #   • le demarrage est 3 a 5 fois plus rapide, l'application n'ayant
          #     plus a se decompresser dans un dossier temporaire a chaque
          #     lancement ;
          #   • --onefile combine a --windowed etait deprecie par PyInstaller
          #     et devient BLOQUANT en v7.0. Le probleme est donc reglé avant
          #     de se poser.
          # Le paquet est plus gros (~60-80 Mo au lieu de 20-30), ce qui reste
          # sans consequence pour une application distribuee par DMG.
          # La suite du workflow est inchangee : --windowed produit
          # dist/PodAdmin.app dans les deux modes.
          pyinstaller --onedir --windowed --name "PodAdmin" \
            --icon assets/icon.icns \
            --collect-all customtkinter \
            --collect-all keyring \
            --collect-all tkinterdnd2 \
            --collect-all openpyxl \
            --collect-all certifi \
            --collect-all requests \
            --add-data "assets:assets" \
            app.py

      # Sur Apple Silicon, macOS EXIGE que tout exécutable porte une signature
      # valide. Sans elle, le système refuse l'application avec le message
      # trompeur « est endommagé et ne peut pas être ouvert » — alors que le
      # fichier est intact. Une signature « ad hoc » (-s -) suffit à lever ce
      # blocage : elle ne certifie pas l'éditeur (il faudrait un compte Apple
      # Developer payant pour cela), mais elle rend le paquet cohérent.
      - name: Signer l'application (signature ad hoc)
        run: |
          codesign --force --deep --sign - "dist/PodAdmin.app"
          codesign --verify --deep --strict --verbose=2 "dist/PodAdmin.app"

      # IMPORTANT : ne PAS utiliser `zip` sur un .app. La commande zip ne
      # préserve ni les liens symboliques internes ni les attributs étendus du
      # paquet : la signature est cassée à la décompression, et macOS affiche à
      # nouveau « est endommagé ». `ditto` est l'outil prévu par Apple pour
      # archiver un paquet applicatif sans l'altérer.
      - name: Compresser le .app (ditto, préserve la signature)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PodAdmin.app PodAdmin-macOS.zip

      - name: Publier l'archive macOS
        uses: actions/upload-artifact@v4
        with:
          name: PodAdmin-macOS-zip
          path: dist/PodAdmin-macOS.zip

      - name: Fabriquer le DMG (glisser-déposer vers Applications)
        run: |
          mkdir -p dmg_stage
          # `ditto` préserve la signature et les liens internes du paquet,
          # ce que `cp -R` ne garantit pas.
          ditto "dist/PodAdmin.app" "dmg_stage/PodAdmin.app"
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "PodAdmin" -srcfolder dmg_stage \
            -ov -format UDZO "dist/PodAdmin.dmg"

      - name: Publier le DMG macOS
        uses: actions/upload-artifact@v4
        with:
          name: PodAdmin-macOS-DMG
          path: dist/PodAdmin.dmg

  # ──────────────────── Release GitHub (si tag v*) ─────────────────────
  # Publication : crée la Release et prévient les applications installées.
  # Déclenchée soit par un tag, soit par le bouton « Run workflow » lorsqu'un
  # numéro de version a été saisi. Sans numéro, on compile seulement (essai).
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    # Le jeton automatique de GitHub Actions est en LECTURE SEULE par défaut
    # depuis 2023 : sans cette autorisation, la création de la Release échoue
    # avec « 403 — Resource not accessible by integration ».
    permissions:
      contents: write
    steps:
      # ORDRE IMPORTANT : le checkout d'abord, car il NETTOIE le dossier de
      # travail. Placé après, il supprimerait les artefacts téléchargés — donc
      # les exécutables à publier.
      #
      # Le code est nécessaire pour lire __version__.py : c'est lui qui fait foi
      # pour le numéro de version, et non le champ du formulaire.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      # Le numéro de version vient du CODE COMPILÉ (__version__.py), et non du
      # formulaire. Sans cela, saisir un numéro différent de celui du code
      # produisait une incohérence : l'application affichait « 1.0.3 » tout en
      # étant annoncée comme « 1.0.4 », et signalait donc en permanence une
      # mise à jour disponible... vers elle-même.
      #
      # Le champ « version » du formulaire ne sert plus qu'à DÉCLENCHER la
      # publication : sa valeur exacte est ignorée.
      - name: Déterminer le numéro de version (depuis le code)
        id: v
        shell: bash
        run: |
          NUM=$(grep -oE '__version__[[:space:]]*=[[:space:]]*"[^"]+"' __version__.py | grep -oE '"[^"]+"' | tr -d '"')
          if [ -z "$NUM" ]; then
            echo "::error::Impossible de lire la version dans __version__.py"
            exit 1
          fi
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "Version publiée (lue dans le code) : $NUM"
          SAISI="${{ inputs.version }}"
          if [ -n "$SAISI" ] && [ "$SAISI" != "$NUM" ] && [ "$SAISI" != "OUI" ] && [ "$SAISI" != "oui" ]; then
            echo "::warning::Numero saisi ($SAISI) different du code ($NUM). C'est la version du CODE qui est publiee."
          fi

      # La Release est publiée sur le dépôt PUBLIC, et non sur ce dépôt privé.
      # C'est indispensable : le bouton « Télécharger » du bandeau de mise à
      # jour renvoie vers ce dépôt public. Publier sur le dépôt privé donnerait
      # une page inaccessible (404) à toute personne n'y ayant pas accès.
      #
      # L'écriture se fait avec RELEASES_TOKEN (le jeton créé pour le dépôt
      # public), et non avec le jeton automatique de GitHub Actions, qui n'a
      # aucun droit en dehors de ce dépôt-ci.
      - name: Créer la release sur le dépôt public
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO || format('{0}/podadmin-releases', github.repository_owner) }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.v.outputs.num }}
          name: PodAdmin v${{ steps.v.outputs.num }}
          body: ${{ inputs.notes || 'Nouvelle version.' }}
          files: |
            PodAdmin-Windows-Setup/PodAdmin-Setup.exe
            PodAdmin-Windows-portable/PodAdmin.exe
            PodAdmin-macOS-DMG/PodAdmin.dmg
            PodAdmin-macOS-zip/PodAdmin-macOS.zip

      # ── Notification de mise à jour, entièrement automatique ──────────────
      # Cette étape écrit `version.json` sur le dépôt PUBLIC des releases.
      # C'est ce fichier que les applications installées consultent au
      # démarrage pour savoir qu'une version plus récente existe.
      #
      # Vous n'avez RIEN à faire à la main : saisir le numéro de version dans
      # le formulaire « Run workflow » (ou poser un tag) suffit.
      #
      # Prérequis (une seule fois) : créer un secret nommé RELEASES_TOKEN
      # dans ce dépôt (Settings → Secrets and variables → Actions), contenant
      # un jeton GitHub autorisé à écrire sur le dépôt public.
      # Sans ce secret, l'étape est simplement IGNORÉE : la publication des
      # exécutables se déroule normalement.
      - name: Publier version.json sur le dépôt public
        if: env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DEPOT_PUBLIC: ${{ vars.RELEASES_REPO }}
        run: |
          set -e
          VERSION="${{ steps.v.outputs.num }}"
          DEPOT="${DEPOT_PUBLIC:-${GITHUB_REPOSITORY_OWNER}/podadmin-releases}"

          # Résumé affiché dans le bandeau : celui saisi dans le formulaire,
          # sinon une phrase neutre.
          NOTES="${{ inputs.notes }}"
          [ -z "$NOTES" ] && NOTES="Nouvelle version disponible."

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/$DEPOT/releases/latest",
            "notes": "$NOTES",
            "version_minimale": ""
          }
          EOF
          echo "Contenu publié :" && cat version.json

          git clone --depth 1 \
            "https://x-access-token:${RELEASES_TOKEN}@github.com/${DEPOT}.git" public
          cp version.json public/version.json
          cd public
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "Version $VERSION"
          git push
